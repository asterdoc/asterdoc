packages:
  - "apps/*"
  - "packages/*"

catalog:
  tsup: "^8.4.0"
  "@types/node": "^22.15.3"
  "@types/react": "19.2.7"
  "@types/react-dom": "19.2.3"
  "@vitest/coverage-v8": "^2.1.8"
  vitest: "^2.1.8"
  typescript: "5.9.2"
  eslint: "^9.34.0"
  ajv: "^8.17.1"
  ajv-formats: "^3.0.1"
  yaml: "^2.8.1"
  # Phone styles of @asterdoc/format/phone, with minimal metadata. Pinned:
  # its metadata decides printed output, so an update is a reviewed change.
  libphonenumber-js: "1.13.15"
  # English subdivision names (ISO 3166-2) for @asterdoc/format/regions, and the
  # CLDR containment that says which subdivision codes are current. Pinned: the
  # regions tests record this release's counts.
  cldr-subdivisions-full: "49.0.0"
  cldr-core: "49.0.0"
  # Bundles packages in tests and size reports to measure what a browser build carries.
  esbuild: "^0.27.2"

  "@neondatabase/serverless": "^1.0.2"
  "@orpc/contract": "^1.10.3"
  date-fns: "^4.1.0"
  drizzle-orm: "^0.44.6"
  fast-deep-equal: "^3.1.3"
  lodash: "^4.17.21"
  "lucide-react": "^0.560.0"
  nanoid: "^5.1.6"
  "@phosphor-icons/react": "^2.1.10"
  react: "19.2.1"
  react-dom: "19.2.1"
  qrcode.react: "4.2.0"
  jsqr: "1.4.0"
  semver: "^7.7.3"
  uuid: "^13.0.0"
  validator: "^13.15.15"
  yaml-diff-patch: "^2.0.0"
  zod: "^4.1.12"
  "@workos-inc/node": "^7.81.0"
  ai: "^6.0.108"
  dotenv: "^17.2.3"
  "@types/dotenv": "^8.2.3"
  tsx: "^4.20.6"
  stripe: "^20.0.0"
  cron-schedule: "^5.0.1"
  cronstrue: "^2.55.0"

  # @asterdoc/react. The default PDF engine and its JSX bridge are pinned
  # exactly: the engine's layout output is what the parity suite measures, so a
  # patch bump would invalidate the recorded numbers.
  takumi-pdf: "0.4.2"
  "@takumi-rs/helpers": "2.5.11"
  # Carries the braille codepoints core's flow signature marker is written in.
  # Pinned exactly: its glyph advances sit on the measured line.
  "@fontsource/noto-sans-symbols-2": "5.3.0"
  # The document typeface. Pinned exactly: @asterdoc/react embeds the files the
  # preview loads, so a minor bump would change the bytes of every rendered PDF.
  "@fontsource-variable/inter": "5.2.8"
  # Additional registered families use the same files in preview and PDF.
  "@fontsource-variable/source-serif-4": "5.3.0"
  "@fontsource-variable/noto-sans-arabic": "5.3.0"
  # The experimental Chromium adapter compiles the document's stylesheet with
  # Tailwind in Node and prints the page with Puppeteer. Neither downloads a
  # browser: both take one from PUPPETEER_EXECUTABLE_PATH or a known path.
  tailwindcss: "^4.1.5"
  puppeteer: "^24.9.0"
  shadcn: "^4.16.2"
  # Reads a rendered PDF back in the tests, page by page.
  pdfjs-dist: "5.4.296"

allowBuilds:
  esbuild: true
